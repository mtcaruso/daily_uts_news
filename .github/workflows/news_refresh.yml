name: News Refresh (resumos a cada 2h)

# Roda apenas o news_summarize.py — pega notícias novas e gera summary.
# NÃO envia e-mail (o digest fica só no daily.yml às 20h BRT).

on:
  schedule:
    # A cada 2h entre 08h e 22h BRT (UTC-3): 11, 13, 15, 17, 19, 21, 01 UTC
    # Pula 23 UTC pra não conflitar com o daily.yml (20h BRT)
    - cron: "0 11,13,15,17,19,21,1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Gerar summaries das notícias
        run: python news_summarize.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOKBACK_HOURS: "30"
      - name: Commit news_history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_history.json news_diagnostic.json
          git diff --staged --quiet || git commit -m "Refresh news summaries [skip ci]"
          git pull --rebase origin main || true
          git push
