name: DOU MME/ANEEL Digest

# A cada 1h @:17 das 07h às 19h BRT, Seg-Sex (mesmo padrão que aneel_aux.yml e
# news_refresh.yml que funcionam de forma confiável). 5-cron entries separadas
# era flaky — single-cron com hour-list é robusto.
# Email só envia se houver items novos (--email-if-new) — multi-runs no mesmo
# dia não duplicam email.
on:
  schedule:
    # 2x na manhã (07:15 e 08:15 BRT), Seg-Sex. A edição do DOU é publicada de
    # madrugada — o run das 07:15 garante o DOU do dia na nuvem ANTES do usuário
    # abrir o dashboard cedo, sem depender do PC local estar ligado.
    # NOTA: cron do GHA = hora de ENTRAR NA FILA; execução real tem jitter de
    # 0-10min (começa ~07:15-07:25). Single-entry com hour-list é o padrão
    # robusto (multi-entries separadas eram dropadas). Frequência extra não
    # queima cota: atos novos são resumidos 1x de qualquer forma. O
    # local_refresh.bat (30min) cobre o resto do dia. --email-if-new idempotente.
    - cron: "15 10,11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run DOU scraper
        continue-on-error: true
        run: python dou_mme.py --email-if-new
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit dou_history.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dou_history.json
          git diff --staged --quiet || git commit -m "Update DOU history [skip ci]"
          git pull --rebase origin main || true
          git push
