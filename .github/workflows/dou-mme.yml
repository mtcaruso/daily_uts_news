name: DOU MME/ANEEL Digest

# Multi-cron @ :17 (fora do top-of-hour pra evitar saturação do GH Actions)
# Email só envia se houver items novos (--email-if-new) — multi-runs no mesmo
# dia não duplicam email.
on:
  schedule:
    - cron: "17 10 * * 1-5"
    - cron: "17 11 * * 1-5"
    - cron: "17 12 * * 1-5"
    - cron: "17 13 * * 1-5"
    - cron: "17 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run DOU scraper
        continue-on-error: true
        run: python dou_mme.py --email-if-new
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit dou_history.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dou_history.json
          git diff --staged --quiet || git commit -m "Update DOU history [skip ci]"
          git pull --rebase origin main || true
          git push
