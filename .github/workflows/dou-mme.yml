name: DOU MME/ANEEL Digest

# A cada 1h @:17 das 07h às 19h BRT, Seg-Sex (mesmo padrão que aneel_aux.yml e
# news_refresh.yml que funcionam de forma confiável). 5-cron entries separadas
# era flaky — single-cron com hour-list é robusto.
# Email só envia se houver items novos (--email-if-new) — multi-runs no mesmo
# dia não duplicam email.
on:
  schedule:
    # 1x/dia, na primeira janela da manhã (08:17 BRT = 11:17 UTC), Seg-Sex.
    # O DOU do dia já está publicado nesse horário. O local_refresh.bat (a cada
    # 30min) cobre como backup e captura assim que o PC liga. --email-if-new é
    # idempotente, então não duplica email mesmo se o local rodar antes.
    - cron: "17 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run DOU scraper
        continue-on-error: true
        run: python dou_mme.py --email-if-new
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit dou_history.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dou_history.json
          git diff --staged --quiet || git commit -m "Update DOU history [skip ci]"
          git pull --rebase origin main || true
          git push
