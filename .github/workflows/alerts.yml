name: Alerts (30min push notifications)

on:
  schedule:
    # A cada 30 minutos
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pandas
      - run: python alerts.py
        env:
          # Esses são lidos pelo digest.py no import (mesmo sem usar)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alerts_state.json
          git diff --staged --quiet || git commit -m "Update alerts state [skip ci]"
          git push
