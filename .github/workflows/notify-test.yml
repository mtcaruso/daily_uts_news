name: Notify Test (WhatsApp / ntfy)

# Dispare MANUALMENTE (aba Actions → "Notify Test" → Run workflow) pra validar
# que o CallMeBot/WhatsApp está configurado. Manda 1 mensagem de teste pros
# canais (WhatsApp se os secrets existirem + ntfy sempre).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Diagnóstico + teste de notificação
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_test.py
