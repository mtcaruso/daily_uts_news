name: Notify Test (WhatsApp / ntfy)

# Dispare MANUALMENTE (aba Actions → "Notify Test" → Run workflow) pra validar
# que o CallMeBot/WhatsApp está configurado. Manda 1 mensagem de teste pros
# canais (WhatsApp se os secrets existirem + ntfy sempre).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Enviar notificação de teste
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          python -c "import notify; ok = notify.send('🧪 Teste de alerta', 'Se você recebeu isso no WhatsApp, o CallMeBot está OK! (também foi pro ntfy)', priority='high'); print('enviado em ao menos 1 canal:', ok)"
