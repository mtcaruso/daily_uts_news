name: CVM Real-Time Scraper

on:
  schedule:
    # A cada 5 minutos, 7 dias por semana — pega FRs/Comunicados quase em tempo real.
    # GHA pode dropar alguns runs (mínimo recomendado é 5min), mas mesmo 70%
    # de sucesso já dá uma cobertura muito boa.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - run: python cvm_realtime.py
      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cvm_recent.json alerts_state.json
          git diff --staged --quiet || git commit -m "Update CVM realtime state [skip ci]"
          git pull --rebase origin main || true
          git push
