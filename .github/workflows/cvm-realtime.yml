name: CVM Real-Time Scraper

on:
  schedule:
    # A cada 15 minutos, 7 dias por semana. ERA */5, mas a auditoria (API do GHA)
    # mostrou que o GitHub DROPAVA ~99% dos runs de 5min — entregava só ~2/dia.
    # O agendador honra muito melhor intervalos menos agressivos (*/15). O
    # self-host local (30min) cobre o resto. Sem Gemini aqui, então não há cota
    # em jogo — é puro frescor de FR/Comunicado.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - run: python cvm_realtime.py
        env:
          # WhatsApp via CallMeBot (opcional — sem isso, FR/Comunicado vão só no ntfy)
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          WHATSAPP_TEMPLATE: ${{ secrets.WHATSAPP_TEMPLATE }}
      - name: Commit state changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cvm_recent.json alerts_state.json
          git diff --staged --quiet || git commit -m "Update CVM realtime state [skip ci]"
          git pull --rebase origin main || true
          git push
