name: MME Legislação tracker

# Coleta Portarias, Decretos, Leis e Portarias Interministeriais do MME.
# Desde 08/10/2026 quem roda de hora em hora (07-23h BRT, seg-sex) é o
# alerts-loop.yml: o cron daqui era descartado pelo agendador (2 runs em 08/10)
# e, rodando junto com o loop, alertaria em dobro. Aqui ficou só o disparo manual.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run MME legislação scraper
        continue-on-error: true
        run: python mme_legislacao.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Alertas de Portaria/Decreto/Lei nova (notify.py; ntfy vai sempre)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      - name: Commit mme_legislacao_history.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mme_legislacao_history.json mme_legislacao_diagnostic.json
          git diff --staged --quiet || git commit -m "Update MME legislação history [skip ci]"
          git pull --rebase origin main || true
          git push
