name: MME Legislação tracker

# Coleta Portarias, Decretos, Leis e Portarias Interministeriais do MME.
# 2x/dia (manhã + tarde), Seg-Sex. Top-of-hour fora — pega :23 pra evitar
# saturação do GH Actions.

on:
  schedule:
    - cron: "23 11 * * 1-5"   # 08:23 BRT
    - cron: "23 17 * * 1-5"   # 14:23 BRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run MME legislação scraper
        continue-on-error: true
        run: python mme_legislacao.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Commit mme_legislacao_history.json
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mme_legislacao_history.json mme_legislacao_diagnostic.json
          git diff --staged --quiet || git commit -m "Update MME legislação history [skip ci]"
          git pull --rebase origin main || true
          git push
