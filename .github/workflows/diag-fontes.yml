name: Diagnóstico temporário (fontes de consulta pública)

# Temporário (21/10/2026): cada alerta de CP/TS roda em modo simulado de dentro
# do Actions (nada é enviado nem salvo) e o resultado sai como anotação, que a
# API pública mostra (os logs não). Apagar depois do teste.
on:
  push:
    paths: [".github/workflows/diag-fontes.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt pandas
      - name: Roda os alertas de consulta em modo simulado
        env:
          RESEND_API_KEY: x
          DIGEST_TO: x
        run: |
          python - <<'PY'
          import contextlib, copy, io, re, time
          import alerts
          alerts.notify.send = lambda *a, **k: True  # nada sai
          state = alerts.load_state()

          def run(nome, fn):
              buf, t = io.StringIO(), time.time()
              try:
                  with contextlib.redirect_stdout(buf), contextlib.redirect_stderr(buf):
                      fn()
                  out = " | ".join(l.strip() for l in buf.getvalue().splitlines() if l.strip())[-350:]
                  ruim = re.search(r"erro|falh|vazia|sem o JSON|layout|Traceback|timed out", out, re.I)
                  print(f"::{'warning' if ruim else 'notice'}::{nome} ({time.time() - t:.0f}s): {out or '(sem saída)'}")
              except Exception as e:
                  print(f"::warning::{nome} ({time.time() - t:.0f}s): EXCEÇÃO {type(e).__name__}: {str(e)[:200]}")

          run("MME CP", lambda: alerts.alert_mme_cp(copy.deepcopy(state), dry=True))
          run("ARSESP", lambda: alerts.alert_arsesp(copy.deepcopy(state), dry=True))
          st = copy.deepcopy(state); st.get("arsae", {}).pop("mod", None)  # força baixar a página
          run("ARSAE", lambda: alerts.alert_arsae(st, dry=True))
          run("ANEEL DOU (hoje)", lambda: alerts.alert_aneel_dou(copy.deepcopy(state), dry=True))
          run("ANEEL DOU 08/10 (CPs 36 e 37)", lambda: print(
              [re.sub(r"<[^>]+>", "", a.get("title") or "") for a in alerts._dou_aneel_secao3("08-10-2026")]))
          run("ANEEL notícias", lambda: alerts.alert_aneel_noticias(copy.deepcopy(state), dry=True))
          PY
