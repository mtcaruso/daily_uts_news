name: Utilities Daily Digest

on:
  schedule:
    # Seg-Qui 20:00 BRT, lookback 30h
    - cron: "0 23 * * 1-4"
    # Domingo 20:00 BRT, lookback 72h (cobre Qui 20h -> Dom 20h, pulando Sex/Sab)
    - cron: "0 23 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python digest.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM }}
          LOOKBACK_HOURS: ${{ github.event.schedule == '0 23 * * 0' && '72' || '30' }}
      - name: Gerar summaries das notícias
        run: python news_summarize.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LOOKBACK_HOURS: ${{ github.event.schedule == '0 23 * * 0' && '72' || '30' }}
      - name: Commit news_history.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_history.json
          git diff --staged --quiet || git commit -m "Update news history [skip ci]"
          git pull --rebase origin main || true
          git push
