name: Site Monitor Regulatório (GitHub Pages)

# Publica a pasta site/ no GitHub Pages. Só roda quando o site muda: os DADOS
# (regulatorio.json) não passam por aqui, o site lê direto do raw.githubusercontent
# (o alerts-loop atualiza a cada 15min). Pré-requisito, uma vez: Settings → Pages →
# Build and deployment → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
