name: Diagnóstico temporário (digest de PLs no Actions)

# Temporário (21/10/2026): a coleta do digest roda de dentro do Actions, sem
# e-mail e sem salvar estado; o resultado sai como anotação. Apagar depois.
on:
  push:
    paths: [".github/workflows/diag-pls.yml"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Coleta (sem e-mail, sem estado)
        run: |
          python - <<'PY'
          import time
          from datetime import datetime, timedelta, timezone
          import pls_consultas as pc
          st = pc.load_state(); hoje = (datetime.now(timezone.utc) - timedelta(hours=3)).strftime("%Y-%m-%d")
          for nome, fn in (("Câmara", lambda: pc.collect_camara(st, 3)),
                           ("Senado", lambda: pc.collect_senado(st, hoje)),
                           ("ANEEL pauta", lambda: pc.collect_aneel_pauta(st, hoje)[0]),
                           ("ANEEL abertas", lambda: pc.collect_aneel_prazos(hoje))):
              t = time.time()
              try:
                  r = fn()
                  print(f"::notice::{nome}: {len(r)} itens em {time.time() - t:.0f}s"
                        + (f" | senado_ok_ate={st.get('senado_ok_ate')}" if nome == "Senado" else ""))
              except Exception as e:
                  print(f"::warning::{nome}: {type(e).__name__}: {str(e)[:180]}")
          PY
