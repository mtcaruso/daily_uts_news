name: CVM Fast (FR near-real-time)

# Loop CONTÍNUO que faz poll da B3 a cada ~1min — latência de Fato Relevante
# ~1min (o mais perto da publicação que dá sem feed pago). NÃO depende do cron
# de 15min ser honrado (o GitHub dropa crons agressivos): é UM job longo que
# fica pollando num while. Repo público = Actions ilimitado → grátis e 24/7,
# sem depender do PC ligado.
#
# EFICIENTE: cvm_fast.py faz 1 request leve à B3 (GetMaterialFacts, ~0.4s, todas
# as empresas) por ciclo — não os 40 endpoints da CVM RAD. Carga irrisória, dá
# pra pollar de 1min tranquilo. O cvm-realtime (15min, CVM RAD direto) segue de
# fallback se a B3 mudar/cair.
on:
  schedule:
    # reinicia a cada 4h (o job loopa ~5.5h → sobrepõe e cobre um cron dropado)
    - cron: "3 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cvm-fast
  cancel-in-progress: true  # novo run cancela o antigo (nunca 2 loops pollando juntos)

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests
      - name: git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Poll loop (~1min, por ~5.5h)
        env:
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          end=$(( $(date +%s) + 19800 ))   # ~5.5h
          while [ $(date +%s) -lt $end ]; do
            python cvm_fast.py || true
            sleep 60
          done
